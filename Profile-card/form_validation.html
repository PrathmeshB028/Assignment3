<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>User Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #999;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .success {
            color: green;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 10px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>User Registration Form</h2>
        <form id="registrationForm">
            <label>Full Name</label>
            <input type="text" id="fullname">
            <div class="error" id="nameError"></div>
            <label>Email Address</label>
            <input type="text" id="email">
            <div class="error" id="emailError"></div>
            <label>Phone Number</label>
            <input type="text" id="phone">
            <div class="error" id="phoneError"></div>
            <label>Password</label>
            <input type="password" id="password">
            <div class="error" id="passwordError"></div>
            <button type="submit">
                Register
            </button>
        </form>
        <p id="message" class="success"></p>

    </div>
    <script>
        document.getElementById("registrationForm").addEventListener("submit", function (event) {
            event.preventDefault();
            document.getElementById("nameError").innerHTML = "";
            document.getElementById("emailError").innerHTML = "";
            document.getElementById("phoneError").innerHTML = "";
            document.getElementById("passwordError").innerHTML = "";
            document.getElementById("message").innerHTML = "";
            let fullname = document.getElementById("fullname").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let password = document.getElementById("password").value;
            let valid = true;
            let namePattern = /^[A-Za-z ]{3,}$/;
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let phonePattern = /^[0-9]{10}$/;
            let passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (!namePattern.test(fullname)) {
                document.getElementById("nameError").innerHTML = "Enter only letters (minimum 3 characters).";
                valid = false;
            } if (!emailPattern.test(email)) {
                document.getElementById("emailError").innerHTML = "Enter a valid email address.";
                valid = false;
            } if (!phonePattern.test(phone)) {
                document.getElementById("phoneError").innerHTML = "Phone number must contain exactly 10 digits.";
                valid = false;
            } if (!passwordPattern.test(password)) {
                document.getElementById("passwordError").innerHTML = "Password must be at least 8 characters with 1 uppercase, 1 lowercase and 1 number.";
                valid = false;
            } if (valid) {
                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerHTML = "Registration Successful!";
            }
            else {
                document.getElementById("message").style.color = "red";
                document.getElementById("message").innerHTML = "Registration Failed!";
            }
        });
    </script>
</body>

</html>
